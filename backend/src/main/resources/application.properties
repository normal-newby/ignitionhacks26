spring.application.name=ignitionhacks
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Explicit, because relaxed binding won't bridge WORLD_LABS_API_KEY -> marble.api-key
# (the names differ by more than case). Works whether the key arrives as a real env var
# on Render or as an entry in the imported .env file.
marble.api-key=${WORLD_LABS_API_KEY:}

# Gemini — used only to guess a catalog item's real-world dimensions from its name, category
# and thumbnail. Explicit for the same reason as the Marble key. Empty default keeps the app
# bootable without it; the estimate endpoint then 503s and the admin types the numbers in.
gemini.api-key=${GEMINI_API_KEY:}

# MinIO — catalog GLBs and thumbnails. Postgres keeps the URL, never the bytes.
# Same explicit-mapping reason as the Marble key: MINIO_ROOT_USER won't relax-bind to
# minio.access-key. Empty defaults keep the app bootable without storage; uploads then fail
# with a clear 503 instead of the context refusing to start.
#
# MINIO_ENDPOINT is the address the *backend* uses — on Render, the internal URL, so uploads
# stay inside Render's network. MINIO_PUBLIC_URL is what the *browser* uses, since the
# internal name doesn't resolve outside. Locally they're usually the same.
minio.endpoint=${MINIO_ENDPOINT:}
minio.public-url=${MINIO_PUBLIC_URL:}
minio.bucket=${MINIO_BUCKET:furniture}
minio.access-key=${MINIO_ROOT_USER:}
minio.secret-key=${MINIO_ROOT_PASSWORD:}

# A GLB this big already stalls the editor; the cap is about the browser, not the bucket.
minio.max-model-size=20MB
minio.max-thumbnail-size=5MB

# Room-scan videos, forwarded to World Labs' media store and never kept. 100MB is Marble's
# own ceiling: prepare_upload signs "x-goog-content-length-range: 0,104857600" into the
# upload URL, so anything larger is rejected by object storage no matter what we allow here.
# Above the threshold Spring spools to a temp file rather than the heap, so this streams.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
spring.servlet.multipart.file-size-threshold=512KB

# A 100MB upload over a slow connection takes a while; don't kill it mid-stream.
spring.mvc.async.request-timeout=-1
server.tomcat.connection-timeout=5m

# Without this Spring returns a bare {"status":400,"error":"Bad Request"} and the reason on
# every ResponseStatusException is dropped — so "That file is 56MB; the limit is 20MB" never
# reaches the user. Every message we raise is one we wrote for them to read.
#
# Note the prefix: Spring Boot 4 moved these from server.error.* to spring.web.error.*.
# The old name binds to nothing and fails silently, which looks exactly like the feature
# not working.
spring.web.error.include-message=always

server.address=0.0.0.0
server.port=${PORT:8080}
