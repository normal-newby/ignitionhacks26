spring.application.name=ignitionhacks
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Explicit, so the keys bind whether they arrive as real env vars (Render) or as entries in
# the imported .env file — relaxed binding only uppercases for the system-environment source.
gemini.api-key=${GEMINI_API_KEY:}
marble.api-key=${MARBLE_API_KEY:}

# Frames are downscaled in the browser (~200-400KB each, capped at 12 per tour),
# so this is generous headroom rather than an expected size.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

server.address=0.0.0.0
server.port=${PORT:8080}